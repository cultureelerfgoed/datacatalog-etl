name: 'Run .trig file validation for PRs on main' 

on:
  pull_request: 
    branches:
      - main   
      - editor-pilot
  push: 
    branches:
      - main   
      - editor-pilot

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run .trig validation for each file
      run: |
        for file in datamodel/*.trig; do python -c "from rdflib import Dataset; Dataset().parse('$file', format='trig'); print('Valid TriG')"; done
