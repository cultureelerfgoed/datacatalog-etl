name: 'Harvest and validate new datacatalog using NDE validation service' 

on:
  workflow_dispatch: {}   

jobs:
  validate-datacatalog-by-body:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Get latest datacatalog 
      run: |
        python src/datacatalog_service.py
    - name: Validate 
      run: |
        python src/validator.py --method 'GET' --status 200

